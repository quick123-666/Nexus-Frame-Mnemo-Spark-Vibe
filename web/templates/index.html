<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFM-SV Vibe 控制面板</title>
    <style>
        :root {
            --bg-primary: #0B0F1A;
            --bg-panel: #111827;
            --bg-card: #1E293B;
            --bg-card-hover: #263347;
            --bg-input: #0F172A;
            --border-primary: #1E293B;
            --border-light: #334155;
            --border-accent: #4F46E5;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --accent-primary: #6366F1;
            --accent-light: #818CF8;
            --accent-cyan: #06B6D4;
            --sky: #38BDF8;
            --success: #10B981;
            --success-bg: #052E16;
            --warning: #F59E0B;
            --warning-bg: #451A03;
            --error: #EF4444;
            --error-bg: #450A0A;
            --gradient-accent: linear-gradient(135deg, #6366F1, #06B6D4);
            --gradient-bg: radial-gradient(ellipse at top, #1E1B4B 0%, #0B0F1A 50%);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            background-image: var(--gradient-bg);
        }

        /* ===== HEADER ===== */
        .header {
            height: 56px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: relative;
            z-index: 100;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: 0.5;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }

        .logo-text {
            font-size: 16px;
            font-weight: 700;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: var(--radius-sm);
        }

        .nav-tab {
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
        }

        .nav-tab:hover { color: var(--text-primary); background: var(--bg-card-hover); }
        .nav-tab.active { color: var(--text-primary); background: var(--accent-primary); }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: var(--transition);
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
            animation: pulse-green 2s infinite;
        }

        .status-dot.error { background: var(--error); }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 4px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.8); }
        }

        /* ===== LAYOUT ===== */
        .layout {
            display: flex;
            height: calc(100vh - 56px);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-primary);
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 16px;
            transition: var(--transition);
        }

        .card:hover {
            border-color: var(--border-accent);
            box-shadow: var(--shadow-glow);
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--sky);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-body {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Progress Bar */
        .progress-bar {
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-accent);
            border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        /* Todo List */
        .todo-list { list-style: none; }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-primary);
            font-size: 13px;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .todo-item:last-child { border-bottom: none; }

        .todo-item.active { color: var(--text-primary); }

        .todo-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
        }

        .todo-icon.done { background: var(--success-bg); color: var(--success); }
        .todo-icon.active { background: rgba(99, 102, 241, 0.2); color: var(--accent-light); animation: pulse 1.5s infinite; }
        .todo-icon.pending { background: var(--bg-card-hover); color: var(--text-muted); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        /* Tags */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-light);
            font-size: 11px;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        /* Confidence Badge */
        .confidence {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .confidence.high { background: var(--success-bg); color: var(--success); }
        .confidence.medium { background: var(--warning-bg); color: var(--warning); }
        .confidence.low { background: var(--error-bg); color: var(--error); }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-area {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.6;
            animation: fadeInUp 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.system {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: var(--gradient-accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .message.success {
            background: var(--bg-card);
            border: 1px solid var(--success);
            border-left: 3px solid var(--success);
            color: var(--success);
            align-self: flex-start;
        }

        .message.error {
            background: var(--bg-card);
            border: 1px solid var(--error);
            border-left: 3px solid var(--error);
            color: var(--error);
            align-self: flex-start;
        }

        .message code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
        }

        .message pre {
            background: var(--bg-input);
            border: 1px solid var(--border-primary);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-top: 8px;
            overflow-x: auto;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Indicators */
        .indicator {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 12px;
            animation: fadeInUp 0.3s ease-out;
        }

        .indicator.routing { border-left: 3px solid var(--sky); }
        .indicator.autofix { border-left: 3px solid var(--success); }
        .indicator strong { color: var(--text-primary); font-size: 13px; }
        .indicator small { color: var(--text-secondary); }

        /* Input Area */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border-primary);
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-panel);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-area input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            background: var(--bg-input);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: var(--transition);
            outline: none;
        }

        .input-area input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-area input::placeholder { color: var(--text-muted); }
        .input-area input:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--gradient-accent);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-stop {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-stop:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--error);
        }

        /* ===== OUTPUT PANEL ===== */
        .output-panel {
            width: 360px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-primary);
            background: var(--bg-card);
        }

        .panel-tab {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
        }

        .panel-tab:hover { color: var(--text-primary); }
        .panel-tab.active { color: var(--accent-light); border-bottom-color: var(--accent-primary); }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .panel-content::-webkit-scrollbar { width: 4px; }
        .panel-content::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

        .panel-section { display: none; }
        .panel-section.active { display: block; }

        .code-block {
            background: var(--bg-input);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 8px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
        }

        .empty-state-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 20px;
        }

        /* ===== TYPING INDICATOR ===== */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            max-width: 80px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typing-bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .output-panel { width: 300px; }
        }

        @media (max-width: 900px) {
            .output-panel { display: none; }
            .sidebar { width: 240px; }
        }

        @media (max-width: 640px) {
            .sidebar { display: none; }
            .nav-tabs { display: none; }
            .message { max-width: 95%; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <span class="logo-text">NFM-SV</span>
        </div>
        <nav class="nav-tabs">
            <button class="nav-tab active">控制面板</button>
            <button class="nav-tab">对话</button>
            <button class="nav-tab">代码</button>
        </nav>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">未连接</span>
        </div>
    </header>

    <!-- LAYOUT -->
    <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <!-- Plan Card -->
            <div class="card">
                <div class="card-title">📋 当前计划</div>
                <div class="card-body" id="planText">等待任务输入...</div>
            </div>

            <!-- Progress Card -->
            <div class="card">
                <div class="card-title">🚀 执行进度</div>
                <div class="card-body" id="progressText">准备就绪</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 11px; color: var(--text-muted);">完成度</span>
                    <span class="confidence low" id="confidenceBadge">0%</span>
                </div>
            </div>

            <!-- Todo Card -->
            <div class="card">
                <div class="card-title">✅ 任务清单</div>
                <ul class="todo-list" id="todoList">
                    <li class="todo-item">
                        <span class="todo-icon pending">○</span>
                        等待中...
                    </li>
                </ul>
            </div>

            <!-- Knowledge Card -->
            <div class="card">
                <div class="card-title">🧠 知识库匹配</div>
                <div class="tag-list" id="knowledgeTags">
                    <span class="tag">等待分析...</span>
                </div>
            </div>

            <!-- Mercury Card -->
            <div class="card">
                <div class="card-title">🦀 Mercury 记忆层</div>
                <div class="card-body" id="mercuryStatus">
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-muted);">HOT</span>
                            <span id="mercuryHot" style="color: var(--accent-light);">--</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-muted);">WARM</span>
                            <span id="mercuryWarm" style="color: var(--accent-cyan);">--</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-muted);">COLD</span>
                            <span id="mercuryCold" style="color: var(--text-secondary);">--</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-muted);">Skills</span>
                            <span id="mercurySkills" style="color: var(--success);">--</span>
                        </div>
                    </div>
                    <div class="tag-list" id="mercurySkillTags" style="margin-top: 8px;"></div>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">
            <div class="chat-area" id="chatArea">
                <div class="message system">欢迎使用 NFM-SV Vibe 控制面板。请输入任务以开始。</div>
                <!-- Typing Indicator -->
                <div class="typing" id="typingIndicator" style="display: none;">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="taskInput" placeholder="请描述你的任务..." />
                </div>
                <button class="btn btn-primary" id="sendBtn">
                    <span>发送</span>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M14 2L7 9M14 2L10 14L7 9M14 2L2 6L7 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="btn btn-stop" id="stopBtn">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                        <rect x="2" y="2" width="10" height="10" rx="2"/>
                    </svg>
                </button>
            </div>
        </main>

        <!-- OUTPUT PANEL -->
        <aside class="output-panel">
            <div class="panel-tabs">
                <div class="panel-tab active" data-panel="code">代码输出</div>
                <div class="panel-tab" data-panel="logs">运行日志</div>
            </div>
            <div class="panel-content">
                <div class="panel-section active" id="panelCode">
                    <div class="empty-state" id="codeEmptyState">
                        <div class="empty-state-icon">&lt;/&gt;</div>
                        <div>代码输出将在此显示</div>
                    </div>
                    <div id="codeOutput" style="display: none;">
                        <div class="code-block" id="codeBlock"></div>
                    </div>
                </div>
                <div class="panel-section" id="panelLogs">
                    <div class="empty-state" id="logsEmptyState">
                        <div class="empty-state-icon">📝</div>
                        <div>运行日志将在此显示</div>
                    </div>
                    <div id="logsOutput"></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Safe DOM Access Helper
        function safeGetElement(id) {
            const el = document.getElementById(id);
            if (!el) {
                console.error(`[NFM-UI] Critical DOM element missing: #${id}`);
            }
            return el;
        }

        // Wrap execution to ensure DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const chatArea = safeGetElement('chatArea');
            const taskInput = safeGetElement('taskInput');
            const sendBtn = safeGetElement('sendBtn');
            const stopBtn = safeGetElement('stopBtn');
            const statusDot = safeGetElement('statusDot');
            const statusText = safeGetElement('statusText');
            const planText = safeGetElement('planText');
            const progressText = safeGetElement('progressText');
            const progressFill = safeGetElement('progressFill');
            const confidenceBadge = safeGetElement('confidenceBadge');
            const todoList = safeGetElement('todoList');
            const knowledgeTags = safeGetElement('knowledgeTags');
            const codeOutput = safeGetElement('codeOutput');
            const codeBlock = safeGetElement('codeBlock');
            const codeEmptyState = safeGetElement('codeEmptyState');
            const logsOutput = safeGetElement('logsOutput');
            const logsEmptyState = safeGetElement('logsEmptyState');
            const typingIndicator = safeGetElement('typingIndicator');

            // Check for critical failures
            if (!chatArea || !taskInput || !sendBtn) {
                console.error('[NFM-UI] Initialization aborted due to missing critical elements.');
                return;
            }

            let ws = null;
            let sessionId = 'chat_session'; // Fixed session ID for Chat-First
            let isRunning = false;
            let logCount = 0;
            let stepCount = 0;

            // Panel Tabs
            document.querySelectorAll('.panel-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    const panelId = 'panel' + tab.dataset.panel.charAt(0).toUpperCase() + tab.dataset.panel.slice(1);
                    const panel = safeGetElement(panelId);
                    if (panel) panel.classList.add('active');
                });
            });

        // State Management
        function setRunning(running) {
            isRunning = running;
            taskInput.disabled = running;
            sendBtn.disabled = running;
            if (running) {
                showTyping();
            } else {
                hideTyping();
            }
        }

        function showTyping() {
            typingIndicator.style.display = 'flex';
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
            taskInput.disabled = false;
            sendBtn.disabled = false;
            taskInput.focus();
        }

        function stopTask() {
            // 发送中止信号 (New Protocol)
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'stop' }));
            }
            addMessage('🛑 任务已被用户中止。', 'system');
            addLog('任务被用户中止');
            setRunning(false);
            // Backend handles cancellation logic
        }

        // WebSocket
        let autoReconnect = true;

        function connectWebSocket() {
            if (ws) ws.close();
            autoReconnect = true;

            ws = new WebSocket(`ws://${window.location.host}/ws/${sessionId}`);

            ws.onopen = () => {
                statusDot.className = 'status-dot connected';
                statusText.textContent = '已连接';
                addLog('WebSocket 已连接');
            };

            ws.onclose = () => {
                statusDot.className = 'status-dot';
                statusText.textContent = '未连接';
                setRunning(false);
                if (autoReconnect) {
                    setTimeout(connectWebSocket, 3000);
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };
        }

        function handleWebSocketMessage(data) {
            switch(data.type) {
                case 'message':
                    // 'message' from backend means Agent Reply (End of turn)
                    addMessage(data.text, data.style || 'system');
                    setRunning(false);
                    break;

                case 'thinking':
                    // 'thinking' means Agent is working
                    showTyping();
                    setRunning(true); // Keep locked
                    break;

                case 'routing':
                    addIndicator('routing', `智能路由至 ${data.model}`, data.reason);
                    addLog(`路由至: ${data.model} (${data.reason})`);
                    // Auto-update Sidebar
                    if (data.reason) progressText.textContent = data.reason.substring(0, 30) + "...";
                    break;

                case 'stream_output':
                    addCodeBlock(data.content, data.label);
                    addLog(`输出: ${data.label}`);
                    break;

                case 'complete':
                    addMessage(`✅ ${data.message}`, 'success');
                    addLog(data.message);
                    setRunning(false);
                    break;

                case 'error':
                    addMessage(`❌ 错误: ${data.message}`, 'error');
                    addLog(`错误: ${data.message}`);
                    setRunning(false);
                    break;
            }
        }

        // UI Helpers
        function addMessage(text, style = 'system') {
            hideTyping();
            const msg = document.createElement('div');
            msg.className = `message ${style}`;
            msg.textContent = text;
            
            // Insert before typing indicator
            chatArea.insertBefore(msg, typingIndicator);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            // Update Plan text if it was a user message
            if (style === 'user') {
                planText.textContent = text;
                // Reset progress
                progressFill.style.width = '10%';
                confidenceBadge.textContent = "0%";
                addLog(`开始处理任务: ${text.substring(0, 30)}...`);
            }
        }

        function addIndicator(type, title, subtitle) {
            hideTyping();
            const ind = document.createElement('div');
            ind.className = `indicator ${type}`;
            ind.innerHTML = `<strong>${title}</strong><small>${subtitle}</small>`;
            chatArea.insertBefore(ind, typingIndicator);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addCodeBlock(content, label) {
            codeEmptyState.style.display = 'none';
            codeOutput.style.display = 'block';
            codeBlock.textContent = `// ${label}\n${content}`;

            hideTyping();
            const msg = document.createElement('div');
            msg.className = 'message system';
            msg.innerHTML = `<strong>📤 ${label}</strong>`;
            chatArea.insertBefore(msg, typingIndicator);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            // Update progress
            stepCount++;
            const progress = Math.min(stepCount * 25, 100);
            progressFill.style.width = `${progress}%`;
            confidenceBadge.textContent = `${progress}%`;
            confidenceBadge.className = `confidence ${progress > 80 ? 'high' : progress > 50 ? 'medium' : 'low'}`;
        }

        function addLog(message) {
            logsEmptyState.style.display = 'none';
            logCount++;
            const log = document.createElement('div');
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            log.style.cssText = `padding: 6px 0; border-bottom: 1px solid var(--border-primary); font-size: 12px; color: var(--text-secondary); font-family: 'Fira Code', monospace;`;
            log.innerHTML = `<span style="color: var(--text-muted);">${time}</span> ${message}`;
            logsOutput.appendChild(log);
            logsOutput.scrollTop = logsOutput.scrollHeight;
        }

        // Task Submission (Chat-First Protocol)
        async function sendTask() {
            const task = taskInput.value.trim();
            if (!task || isRunning) return;

            // Add user message immediately
            addMessage(task, 'user');
            taskInput.value = '';
            
            // Send to WebSocket
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'chat', text: task }));
                setRunning(true);
            } else {
                addMessage('⚠️ 未连接到服务器', 'error');
                addLog('WebSocket 连接断开');
            }
        }

        sendBtn.addEventListener('click', sendTask);
        stopBtn.addEventListener('click', stopTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTask();
        });

        connectWebSocket();

        // Load Mercury Status
        async function loadMercuryStatus() {
            try {
                const res = await fetch('/api/mercury/status');
                const data = await res.json();
                if (data.status === 'ok') {
                    const s = data.data;
                    document.getElementById('mercuryHot').textContent = s.hot_size > 0 ? (s.hot_size / 1024).toFixed(1) + ' KB' : 'Empty';
                    document.getElementById('mercuryWarm').textContent = s.warm_days + ' days';
                    document.getElementById('mercuryCold').textContent = s.cold_entries + ' entries';
                    document.getElementById('mercurySkills').textContent = s.skills_count;
                    
                    const skillTags = document.getElementById('mercurySkillTags');
                    if (s.skills.length > 0) {
                        skillTags.innerHTML = s.skills.map(name => `<span class="tag">${name}</span>`).join('');
                    } else {
                        skillTags.innerHTML = '<span style="font-size: 11px; color: var(--text-muted);">No skills found</span>';
                    }
                } else {
                    document.getElementById('mercuryHot').textContent = 'N/A';
                    document.getElementById('mercuryWarm').textContent = 'N/A';
                    document.getElementById('mercuryCold').textContent = 'N/A';
                    document.getElementById('mercurySkills').textContent = 'N/A';
                }
            } catch (e) {
                console.error('Failed to load Mercury status:', e);
            }
        }

        loadMercuryStatus();
        }); // End DOMContentLoaded
    </script>
</body>
</html>
